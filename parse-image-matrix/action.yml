name: Parse image matrix
description: >
  Validate and normalize a JSON array of container image specs for deploy-gke-app.
  Applies defaults for context, dockerfile, deployment, container, needs_pypi_auth,
  and build_secret_env. Optional role (Kubernetes DNS label) fills deployment/container.
  Optional values_key (dotted Helm path) is passed through for helm-rollout.

inputs:
  images:
    description: JSON array of image objects (name required). Set this or images_file.
    required: false
    default: ''
  images_file:
    description: >
      Comma-separated paths and globs (relative to the checkout) of JSON files, each
      holding an array like images; the arrays are concatenated in list order, each
      glob's matches sorted. A glob may match nothing. Image names must be unique.
      Set this or images.
    required: false
    default: ''

outputs:
  matrix:
    description: JSON array suitable for strategy.matrix.include
    value: ${{ steps.parse.outputs.matrix }}
  count:
    description: Number of images
    value: ${{ steps.parse.outputs.count }}
  first_name:
    description: name of the first image (for helm suffix default)
    value: ${{ steps.parse.outputs.first_name }}

runs:
  using: composite
  steps:
    - id: parse
      shell: bash
      env:
        IMAGES_JSON: ${{ inputs.images }}
        IMAGES_FILE: ${{ inputs.images_file }}
      run: python3 "$GITHUB_ACTION_PATH/parse.py"
