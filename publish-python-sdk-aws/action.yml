name: Publish Python SDK (AWS CodeArtifact)
description: >
  Resolve package version (prod base or staging .dev0+sha), fail if prod version
  already exists in CodeArtifact, then uv build and twine upload.

inputs:
  deploy_env:
    description: staging or prod
    required: true
  working_directory:
    description: SDK package directory
    required: false
    default: sdk
  uv_index_prefix:
    description: UV index prefix for CodeArtifact auth
    required: true
  aws_role_arn:
    required: true
  aws_region:
    required: true
  aws_account_id:
    description: AWS account ID (falls back to STS)
    required: false
    default: ''
  codeartifact_domain:
    description: CodeArtifact domain (falls back to CODEARTIFACT_DOMAIN env)
    required: false
    default: ''
  codeartifact_repo:
    description: CodeArtifact repository name
    required: false
    default: pypi

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

    - name: Set up Python
      shell: bash
      run: uv python install 3.11

    - name: Authenticate to CodeArtifact
      uses: ExtensibilityAI/github-actions/setup-codeartifact-auth@v2.4.0
      with:
        aws_role_arn: ${{ inputs.aws_role_arn }}
        aws_region: ${{ inputs.aws_region }}
        uv_index_prefix: ${{ inputs.uv_index_prefix }}
        codeartifact_domain: ${{ inputs.codeartifact_domain }}
        codeartifact_repo: ${{ inputs.codeartifact_repo }}

    - name: Resolve SDK version
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        DEPLOY_ENV: ${{ inputs.deploy_env }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        BASE=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*"\([^"]*\)".*/\1/')
        PACKAGE=$(grep -m1 '^name = ' pyproject.toml | sed 's/.*"\([^"]*\)".*/\1/')
        if [ "$DEPLOY_ENV" = "prod" ]; then
          VERSION="$BASE"
        else
          VERSION="${BASE}.dev0+${SHA}"
        fi
        echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"
        echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Resolve CodeArtifact endpoint
      id: ca
      shell: bash
      env:
        REGION: ${{ inputs.aws_region }}
        INPUT_DOMAIN: ${{ inputs.codeartifact_domain }}
        INPUT_REPO: ${{ inputs.codeartifact_repo }}
        INPUT_ACCOUNT: ${{ inputs.aws_account_id }}
      run: |
        set -euo pipefail
        DOMAIN="${INPUT_DOMAIN:-${CODEARTIFACT_DOMAIN:-}}"
        REPO="${INPUT_REPO:-pypi}"
        ACCOUNT="${INPUT_ACCOUNT:-${AWS_ACCOUNT_ID:-}}"
        if [ -z "$ACCOUNT" ]; then
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
        fi
        if [ -z "$DOMAIN" ]; then
          echo "::error::codeartifact_domain or CODEARTIFACT_DOMAIN is required"
          exit 1
        fi
        echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
        echo "repo=$REPO" >> "$GITHUB_OUTPUT"
        echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
        echo "repository-url=https://${DOMAIN}-${ACCOUNT}.d.codeartifact.${REGION}.amazonaws.com/pypi/${DOMAIN}/${REPO}/" >> "$GITHUB_OUTPUT"

    - name: Fail if prod version already published
      if: inputs.deploy_env == 'prod'
      shell: bash
      env:
        REGION: ${{ inputs.aws_region }}
        DOMAIN: ${{ steps.ca.outputs.domain }}
        REPO: ${{ steps.ca.outputs.repo }}
        ACCOUNT: ${{ steps.ca.outputs.account }}
      run: |
        set -euo pipefail
        # Normalize PEP 503 / distribution name for CodeArtifact package name.
        PKG_NORM=$(echo "$PACKAGE" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
        if aws codeartifact describe-package-version \
          --domain "$DOMAIN" \
          --domain-owner "$ACCOUNT" \
          --repository "$REPO" \
          --format pypi \
          --package "$PKG_NORM" \
          --package-version "$PACKAGE_VERSION" \
          --region "$REGION" \
          >/dev/null 2>&1; then
          echo "::error::Version $PACKAGE_VERSION of $PACKAGE is already in CodeArtifact. Bump version in pyproject.toml."
          exit 1
        fi

    - name: Set SDK version
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: sed -i "s/^version = .*/version = \"$PACKAGE_VERSION\"/" pyproject.toml

    - name: Build and publish
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        REPOSITORY_URL: ${{ steps.ca.outputs.repository-url }}
        UV_INDEX_PREFIX: ${{ inputs.uv_index_prefix }}
      run: |
        set -euo pipefail
        uv sync --extra publish
        uv build
        USER_VAR="UV_INDEX_${UV_INDEX_PREFIX}_PYPI_USERNAME"
        PASS_VAR="UV_INDEX_${UV_INDEX_PREFIX}_PYPI_PASSWORD"
        uv run twine upload \
          --repository-url "$REPOSITORY_URL" \
          -u "${!USER_VAR}" \
          -p "${!PASS_VAR}" \
          dist/*
