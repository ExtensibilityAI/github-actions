name: Deploy EKS app

on:
  workflow_call:
    inputs:
      images:
        description: >
          JSON array of image specs. Each object needs name; optional fields:
          dockerfile, context, role (Kubernetes DNS label, e.g. api|frontend|app),
          deployment, container,
          needs_pypi_auth, build_secret_env.
        type: string
        required: true

      uv_index_prefix:
        description: >
          Prefix for UV_INDEX_<prefix>_PYPI_* credentials. Must match the
          [[tool.uv.index]] name with hyphens turned into underscores and
          without a trailing _PYPI (e.g. EXT_STORE_INFRA_3320 for index
          ext-store-infra-3320-pypi). No default — callers must pass the
          deployment-specific prefix.
        type: string
        required: true

      helm_chart:
        type: string
        required: false
        default: ''
      helm_chart_version:
        description: Optional upstream chart version pin
        type: string
        required: false
        default: ''
      helm_image_repository_suffix:
        description: Defaults to first image name when empty
        type: string
        required: false
        default: ''
      helm_repo_name:
        type: string
        required: false
        default: ''
      helm_repo_url:
        type: string
        required: false
        default: ''
      helm_wait:
        description: Pass --wait on helm upgrade (default true)
        type: boolean
        required: false
        default: true

      run_migrations:
        type: boolean
        required: false
        default: false
      migration_image_name:
        description: >
          Image name under docker-images/ for the migrate Job (defaults to first
          matrix image name). Usually the api/backend image.
        type: string
        required: false
        default: ''
      migration_service_account:
        description: K8s ServiceAccount for the migrate Job
        type: string
        required: false
        default: api
      ecr_repository_prefix:
        description: ECR repository prefix (platform dockerRepoName)
        type: string
        required: false
        default: docker-images

      publish_sdk:
        type: boolean
        required: false
        default: false
      sdk_directory:
        type: string
        required: false
        default: sdk
      force_publish_sdk:
        type: boolean
        required: false
        default: false

      dispatch_environment:
        type: string
        required: false
        default: ''

    secrets:
      migration_extra_env:
        description: >
          Opaque newline-delimited KEY=VALUE (expanded in the caller). Must be a
          workflow_call secret — GitHub forbids secrets.* in reusable with: inputs.
        required: false

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env.outputs.env }}
      stack: ${{ steps.env.outputs.stack }}
      sdk_changed: ${{ steps.detect.outputs.changed || steps.detect-skip.outputs.changed || 'false' }}
      matrix: ${{ steps.images.outputs.matrix }}
      first_name: ${{ steps.images.outputs.first_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: ExtensibilityAI/github-actions/parse-image-matrix@v2.4.0
        id: images
        with:
          images: ${{ inputs.images }}

      - uses: ExtensibilityAI/github-actions/detect-path-changes@v2.4.0
        id: detect
        if: inputs.publish_sdk
        with:
          path_prefix: ${{ inputs.sdk_directory }}
          force: ${{ inputs.force_publish_sdk }}

      - name: Default sdk_changed when publish_sdk is false
        if: ${{ !inputs.publish_sdk }}
        id: detect-skip
        run: echo "changed=false" >> "$GITHUB_OUTPUT"

      - uses: ExtensibilityAI/github-actions/set-deploy-env@v2.4.0
        id: env
        with:
          mode: app
          dispatch_environment: ${{ inputs.dispatch_environment || github.event.inputs.environment || '' }}

  build:
    needs: set-env
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.env }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.set-env.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ExtensibilityAI/github-actions/docker-build-push-aws@v2.4.0
        id: build
        with:
          image_name: ${{ matrix.name }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}
          aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          ecr_repository_prefix: ${{ inputs.ecr_repository_prefix }}
          needs_pypi_auth: ${{ matrix.needs_pypi_auth }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}
          build_secret_env: ${{ matrix.build_secret_env }}

      - name: Write image-changed artifact
        id: artifact
        env:
          NAME: ${{ matrix.name }}
          CHANGED: ${{ steps.build.outputs.image_changed }}
        run: |
          set -euo pipefail
          mkdir -p image-changed
          HASH=$(python3 -c "import hashlib, os; print(hashlib.sha256(os.environ['NAME'].encode()).hexdigest()[:16])")
          echo "$CHANGED" > "image-changed/${HASH}"
          echo "$NAME" > "image-changed/${HASH}.name"
          echo "stem=${HASH}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-changed-${{ steps.artifact.outputs.stem }}
          path: image-changed/
          retention-days: 1

  build-summary:
    needs: [set-env, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.summary.outputs.any_changed }}
      changed_by_name: ${{ steps.summary.outputs.changed_by_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-changed-*
          merge-multiple: true
          path: image-changed

      - id: summary
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, pathlib

          root = pathlib.Path("image-changed")
          mapping = {}
          for name_file in root.glob("*.name"):
              stem = name_file.name[: -len(".name")]
              img_name = name_file.read_text(encoding="utf-8").strip()
              flag_path = root / stem
              flag = flag_path.read_text(encoding="utf-8").strip() if flag_path.exists() else "false"
              mapping[img_name] = flag

          any_changed = "true" if any(v == "true" for v in mapping.values()) else "false"
          changed_json = json.dumps(mapping, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"any_changed={any_changed}\n")
              fh.write(f"changed_by_name={changed_json}\n")
          print(f"any_changed={any_changed} mapping={changed_json}")
          PY

  sdk-publish:
    needs: set-env
    if: inputs.publish_sdk && (needs.set-env.outputs.sdk_changed == 'true')
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ExtensibilityAI/github-actions/publish-python-sdk-aws@v2.4.0
        with:
          deploy_env: ${{ needs.set-env.outputs.env }}
          working_directory: ${{ inputs.sdk_directory }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}
          aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          codeartifact_domain: ${{ vars.CODEARTIFACT_DOMAIN }}
          codeartifact_repo: ${{ vars.CODEARTIFACT_REPOSITORY || 'pypi' }}

  migrations:
    needs: [set-env, build-summary]
    if: |
      always() &&
      inputs.run_migrations &&
      needs.build-summary.result == 'success' &&
      needs.build-summary.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve migration image
        id: image
        env:
          ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
          PREFIX: ${{ inputs.ecr_repository_prefix }}
          NAME: ${{ inputs.migration_image_name || needs.set-env.outputs.first_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${ACCOUNT:-}" ] || [ -z "${REGION:-}" ] || [ -z "${NAME:-}" ]; then
            echo "::error::AWS_ACCOUNT_ID, AWS_REGION, and migration image name are required"
            exit 1
          fi
          REF="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${PREFIX}/${NAME}:${SHA}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: ExtensibilityAI/github-actions/rds-migrate@v2.5.0
        with:
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}
          deploy_env: ${{ needs.set-env.outputs.env }}
          eks_cluster_name: ${{ vars.EKS_CLUSTER_NAME }}
          eks_region: ${{ vars.EKS_REGION || vars.AWS_REGION }}
          k8s_namespace: ${{ vars.K8S_NAMESPACE }}
          migration_image: ${{ steps.image.outputs.ref }}
          service_account: ${{ inputs.migration_service_account }}
          extra_env: ${{ secrets.migration_extra_env }}

  deploy:
    needs: [set-env, migrations, build-summary]
    if: |
      always() &&
      needs.build-summary.result == 'success' &&
      needs.build-summary.outputs.any_changed == 'true' &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          set -euo pipefail
          if [ -z "${{ vars.EKS_CLUSTER_NAME }}" ]; then
            echo "::error::EKS_CLUSTER_NAME environment variable is required"
            exit 1
          fi
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.EKS_REGION || vars.AWS_REGION }}"

      - name: Helm rollout
        uses: ExtensibilityAI/github-actions/helm-rollout@v2.4.0
        with:
          helm_chart: ${{ inputs.helm_chart }}
          helm_chart_version: ${{ inputs.helm_chart_version }}
          helm_image_repository_suffix: ${{ inputs.helm_image_repository_suffix || needs.set-env.outputs.first_name }}
          images_json: ${{ needs.set-env.outputs.matrix }}
          changed_by_name: ${{ needs.build-summary.outputs.changed_by_name }}
          helm_repo_name: ${{ inputs.helm_repo_name }}
          helm_repo_url: ${{ inputs.helm_repo_url }}
          helm_release_var: ${{ vars.HELM_RELEASE }}
          cloud: aws
          image_registry: ${{ vars.IMAGE_REGISTRY }}
          aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
          aws_region: ${{ vars.AWS_REGION }}
          k8s_namespace: ${{ vars.K8S_NAMESPACE }}
          wait: ${{ inputs.helm_wait }}
        env:
          GATEWAY_HOSTNAME: ${{ vars.GATEWAY_HOSTNAME }}
          ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}
          GITHUB_ENVIRONMENT: ${{ needs.set-env.outputs.env }}
          ENVIRONMENT: ${{ needs.set-env.outputs.env }}
