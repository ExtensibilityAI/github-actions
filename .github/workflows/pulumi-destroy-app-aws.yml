name: Pulumi Destroy App (AWS)

on:
  workflow_call:
    inputs:
      slug:
        description: App slug (required)
        type: string
        required: true
      environment:
        description: staging or prod (one stack per run)
        type: string
        required: true
      uv_index_prefix:
        description: >
          Prefix for UV_INDEX_<prefix>_PYPI_* credentials. Must match the
          [[tool.uv.index]] name with hyphens turned into underscores and
          without a trailing _PYPI (e.g. EXT_STORE_INFRA_3320 for index
          ext-store-infra-3320-pypi). No default — callers must pass the
          deployment-specific prefix.
        type: string
        required: true
    secrets:
      INFRA_GITHUB_APP_ID:
        description: GitHub App ID for minting an installation token
        required: true
      INFRA_GITHUB_APP_PRIVATE_KEY:
        description: GitHub App private key (PEM)
        required: true
      INFRA_GITHUB_TOKEN:
        description: Optional legacy PAT (unused in App mode)
        required: false

jobs:
  destroy-app-stack:
    runs-on: ubuntu-latest
    concurrency:
      group: destroy-${{ inputs.slug }}-${{ inputs.environment }}
      cancel-in-progress: false
    environment: ${{ inputs.environment }}
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate destroy inputs
        env:
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          slug="${INPUT_SLUG:-}"
          slug="${slug// /}"
          if [ -z "$slug" ]; then
            echo "::error::destroy requires slug"
            exit 1
          fi
          case "${INPUT_ENVIRONMENT}" in
            staging|prod) ;;
            *)
              echo "::error::environment must be staging or prod"
              exit 1
              ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve GitHub token
        id: github-token
        uses: ExtensibilityAI/github-actions/resolve-github-token@v2.4.0
        with:
          infra-github-token: ${{ secrets.INFRA_GITHUB_TOKEN }}
          app-id: ${{ secrets.INFRA_GITHUB_APP_ID }}
          private-key: ${{ secrets.INFRA_GITHUB_APP_PRIVATE_KEY }}

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup CodeArtifact auth
        uses: ExtensibilityAI/github-actions/setup-codeartifact-auth@v2.4.0
        with:
          aws_role_arn: ${{ vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}

      - name: Sync root CLI deps
        run: uv sync

      - name: Resolve stack workdir
        id: stack
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          workdir=$(uv run infra utils resolve-stack-workdir --slug "${INPUT_SLUG}")
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"

      - name: Sync app stack deps
        working-directory: ${{ steps.stack.outputs.workdir }}
        run: uv sync

      - name: Resolve Pulumi org
        id: pulumi_org
        uses: ExtensibilityAI/github-actions/resolve-pulumi-org@v2.4.0
        with:
          pulumi-dir: ${{ steps.stack.outputs.workdir }}
          stack: ${{ inputs.environment }}
          fallback-pulumi-dir: pulumi/platform

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Update kubeconfig for EKS
        if: vars.EKS_CLUSTER_NAME != ''
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.EKS_REGION || vars.AWS_REGION }}"

      - name: Destroy app (helm uninstall + pulumi destroy)
        env:
          GITHUB_ACCESS_TOKEN: ${{ steps.github-token.outputs.token }}
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
          PULUMI_ENV: ${{ inputs.environment }}
          PULUMI_ORG: ${{ steps.pulumi_org.outputs.pulumi-org }}
          INPUT_SLUG: ${{ inputs.slug }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
          EKS_REGION: ${{ vars.EKS_REGION || vars.AWS_REGION }}
        run: |
          set -euo pipefail
          # infra app-destroy uninstalls external Helm releases then destroys the stack.
          uv run infra app-destroy "${INPUT_SLUG}" --stack "${PULUMI_ENV}"
