name: python-tests

# Unit tests for the Python helpers that composite actions run
# (helm-rollout/, parse-image-matrix/, scripts/).
on:
  push:
    paths:
      - '**/*.py'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/python-tests.yml'

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Run pytest
        run: uvx --python 3.12 --from 'pytest>=8,<9' pytest -q
