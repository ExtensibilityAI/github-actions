name: CI Python backend

on:
  workflow_call:
    inputs:
      backend_directory:
        type: string
        required: false
        default: backend
      frontend_directory:
        type: string
        required: false
        default: frontend
      python_version:
        type: string
        required: false
        default: '3.11'
      node_version:
        type: string
        required: false
        default: '20'
      postgres_db:
        type: string
        required: false
        default: app
      postgres_user:
        type: string
        required: false
        default: admin
      postgres_password:
        type: string
        required: false
        default: guest
      run_frontend:
        type: boolean
        required: false
        default: false
      needs_pypi_auth:
        type: boolean
        required: false
        default: false
      uv_index_prefix:
        type: string
        required: false
        default: EXTENSIBILITY_AI
      use_staging_environment:
        type: boolean
        required: false
        default: true

jobs:
  backend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.use_staging_environment && 'staging' || '' }}
    permissions:
      id-token: write
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ inputs.postgres_user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
          POSTGRES_DB: ${{ inputs.postgres_db }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Set up Python
        run: uv python install ${{ inputs.python_version }}

      - name: Authenticate to PyPI
        if: inputs.needs_pypi_auth
        uses: ExtensibilityAI/github-actions/setup-pypi-auth@v2.1.0
        with:
          wif_provider: ${{ vars.WIF_PROVIDER }}
          pypi_sa: ${{ vars.PYPI_SA }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}

      - name: Install backend dependencies
        working-directory: ${{ inputs.backend_directory }}
        run: uv sync --extra dev

      - name: Lint (ruff)
        working-directory: ${{ inputs.backend_directory }}
        run: uv run ruff check .

      - name: Tests
        working-directory: ${{ inputs.backend_directory }}
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: ${{ inputs.postgres_user }}
          DATABASE_PASSWORD: ${{ inputs.postgres_password }}
          DATABASE_NAME: ${{ inputs.postgres_db }}
          AUTH_DEV_HEADERS_ENABLED: "true"
        run: uv run pytest -v

  frontend:
    if: inputs.run_frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.frontend_directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ inputs.frontend_directory }}
        run: npm ci

      - name: Build
        working-directory: ${{ inputs.frontend_directory }}
        run: npm run build
