name: Pulumi Destroy App (GCP)

on:
  workflow_call:
    inputs:
      slug:
        description: App slug (required)
        type: string
        required: true
      environment:
        description: staging or prod (one stack per run)
        type: string
        required: true
      uv_index_prefix:
        type: string
        required: false
        default: EXTENSIBILITY_AI
      install_gke_auth_plugin:
        type: boolean
        required: false
        default: true
    secrets:
      INFRA_GITHUB_APP_ID:
        description: GitHub App ID for minting an installation token
        required: true
      INFRA_GITHUB_APP_PRIVATE_KEY:
        description: GitHub App private key (PEM)
        required: true
      INFRA_GITHUB_TOKEN:
        description: Optional legacy PAT (unused in App mode)
        required: false

jobs:
  destroy-app-stack:
    runs-on: ubuntu-latest
    concurrency:
      group: destroy-${{ inputs.slug }}-${{ inputs.environment }}
      cancel-in-progress: false
    environment: ${{ inputs.environment }}
    env:
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      INFRA_CLI_SKIP_GCLOUD_CREDENTIALS: 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate destroy inputs
        env:
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          slug="${INPUT_SLUG:-}"
          slug="${slug// /}"
          if [ -z "$slug" ]; then
            echo "::error::destroy requires slug"
            exit 1
          fi
          case "${INPUT_ENVIRONMENT}" in
            staging|prod) ;;
            *)
              echo "::error::environment must be staging or prod"
              exit 1
              ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve GitHub token
        id: github-token
        uses: ExtensibilityAI/github-actions/resolve-github-token@v2.1.2
        with:
          infra-github-token: ${{ secrets.INFRA_GITHUB_TOKEN }}
          app-id: ${{ secrets.INFRA_GITHUB_APP_ID }}
          private-key: ${{ secrets.INFRA_GITHUB_APP_PRIVATE_KEY }}

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Authenticate to GCP for PyPI
        uses: ExtensibilityAI/github-actions/setup-pypi-auth@v2.1.1
        with:
          wif_provider: ${{ vars.WIF_PROVIDER }}
          pypi_sa: ${{ vars.GCP_SA }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}

      - name: Install GKE auth plugin
        if: inputs.install_gke_auth_plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Sync root CLI deps
        run: uv sync

      - name: Resolve stack workdir
        id: stack
        env:
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          workdir=$(uv run infra utils resolve-stack-workdir --slug "${INPUT_SLUG}")
          echo "workdir=$workdir" >> "$GITHUB_OUTPUT"

      - name: Sync app stack deps
        working-directory: ${{ steps.stack.outputs.workdir }}
        run: uv sync

      - name: Resolve Pulumi org
        id: pulumi_org
        uses: ExtensibilityAI/github-actions/resolve-pulumi-org@v2.1.1
        with:
          pulumi-dir: ${{ steps.stack.outputs.workdir }}
          stack: ${{ inputs.environment }}
          fallback-pulumi-dir: pulumi/platform

      - name: Pulumi destroy (app stack)
        working-directory: ${{ steps.stack.outputs.workdir }}
        env:
          GITHUB_ACCESS_TOKEN: ${{ steps.github-token.outputs.token }}
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
          PULUMI_ENV: ${{ inputs.environment }}
          PULUMI_ORG: ${{ steps.pulumi_org.outputs.pulumi-org }}
        run: |
          set -euo pipefail
          project=$(grep '^name:' Pulumi.yaml | awk '{print $2}')
          fqn="${PULUMI_ORG}/${project}/${PULUMI_ENV}"
          if ! uv run pulumi stack select "${fqn}"; then
            echo "Stack ${fqn} not found; skipping destroy."
            exit 0
          fi
          uv run pulumi destroy --yes --run-program
          uv run pulumi stack rm --yes
