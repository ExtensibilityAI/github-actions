name: Pulumi Destroy App (GCP)

on:
  workflow_call:
    inputs:
      slug:
        description: App slug (required)
        type: string
        required: true
      environments:
        description: staging, prod, or both
        type: string
        required: false
        default: both
      uv_index_prefix:
        type: string
        required: false
        default: EXTENSIBILITY_AI
      install_gke_auth_plugin:
        type: boolean
        required: false
        default: true

jobs:
  detect-destroy:
    runs-on: ubuntu-latest
    outputs:
      destroy_slug: ${{ steps.detect.outputs.destroy_slug }}
      destroy_matrix: ${{ steps.detect.outputs.destroy_matrix }}
    steps:
      - name: Validate destroy inputs
        id: detect
        env:
          INPUT_SLUG: ${{ inputs.slug }}
          INPUT_ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          set -euo pipefail
          slug="${INPUT_SLUG:-}"
          slug="${slug// /}"
          if [ -z "$slug" ]; then
            echo "::error::destroy requires slug"
            exit 1
          fi
          envs="${INPUT_ENVIRONMENTS:-both}"
          entries=()
          case "$envs" in
            staging) stacks="staging" ;;
            prod) stacks="prod" ;;
            both) stacks="prod staging" ;;
            *)
              echo "::error::environments must be staging, prod, or both"
              exit 1
              ;;
          esac
          for s in $stacks; do
            entries+=("{\"slug\":\"${slug}\",\"pulumi_env\":\"${s}\"}")
          done
          matrix=$(printf '%s\n' "${entries[@]}" | jq -s -c '.')
          echo "destroy_slug=$slug" >> "$GITHUB_OUTPUT"
          echo "destroy_matrix=$matrix" >> "$GITHUB_OUTPUT"

  destroy-app-stacks:
    needs: detect-destroy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.detect-destroy.outputs.destroy_matrix) }}
    concurrency:
      group: destroy-${{ matrix.slug }}-${{ matrix.pulumi_env }}
      cancel-in-progress: false
    environment: ${{ matrix.pulumi_env }}
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      INFRA_CLI_SKIP_GCLOUD_CREDENTIALS: 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve GitHub token
        id: github-token
        uses: ExtensibilityAI/github-actions/resolve-github-token@v2.1.2
        with:
          infra-github-token: ${{ secrets.INFRA_GITHUB_TOKEN }}
          app-id: ${{ secrets.INFRA_GITHUB_APP_ID }}
          private-key: ${{ secrets.INFRA_GITHUB_APP_PRIVATE_KEY }}

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Authenticate to GCP for PyPI
        uses: ExtensibilityAI/github-actions/setup-pypi-auth@v2.1.1
        with:
          wif_provider: ${{ vars.WIF_PROVIDER }}
          pypi_sa: ${{ vars.GCP_SA }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}

      - name: Install GKE auth plugin
        if: inputs.install_gke_auth_plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - run: uv sync

      - name: Diagnose GitHub tokens (GITHUB_ENV vs output)
        env:
          DIAG_OUTPUT_TOKEN: ${{ steps.github-token.outputs.token }}
          DIAG_INFRA_GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fp() {
            local label="$1"
            local val="${2-}"
            local len="${#val}"
            local empty=true
            local stars=false
            local ws=false
            local sha="-"
            if [ -n "$val" ]; then
              empty=false
              sha="$(printf '%s' "$val" | sha256sum | awk '{print substr($1,1,12)}')"
            fi
            if [ "$val" = "***" ]; then stars=true; fi
            local trimmed
            trimmed="$(printf '%s' "$val" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$val" ] && { [ "$trimmed" != "$val" ] || printf '%s' "$val" | grep -q $'\n'; }; then
              ws=true
            fi
            echo "github_diag phase=gha_env label=${label} len=${len} sha=${sha} empty=${empty} literal_stars=${stars} whitespace=${ws}"
          }
          probe() {
            local label="$1"
            local val="$2"
            local name="$3"
            local url="$4"
            if [ -z "$val" ]; then
              echo "github_diag probe label=${label} url=${name} status=skip req_id=-"
              return
            fi
            local hdr code rid
            hdr="$(mktemp)"
            code="$(curl -sS -o /dev/null -D "$hdr" -w '%{http_code}' \
              -H "Authorization: Bearer ${val}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: infra-github-diag" \
              "$url" || true)"
            rid="$(awk 'BEGIN{IGNORECASE=1} /^x-github-request-id:/{print $2}' "$hdr" | tr -d '\r')"
            rm -f "$hdr"
            echo "github_diag probe label=${label} url=${name} status=${code} req_id=${rid:-"-"}"
          }
          echo "github_diag phase=gha_env"
          fp access "${GITHUB_ACCESS_TOKEN-}"
          fp gh "${GH_TOKEN-}"
          fp actions "${GITHUB_TOKEN-}"
          fp deploy "${DEPLOY_GITHUB_TOKEN-}"
          fp pat "${DIAG_INFRA_GITHUB_TOKEN-}"
          fp output "${DIAG_OUTPUT_TOKEN-}"
          declare -A seen=()
          probe_distinct() {
            local label="$1"
            local val="$2"
            local sha
            if [ -z "$val" ]; then
              return
            fi
            sha="$(printf '%s' "$val" | sha256sum | awk '{print substr($1,1,12)}')"
            if [ -n "${seen[$sha]+x}" ]; then
              echo "github_diag phase=gha_env ${label}=${seen[$sha]}"
              return
            fi
            seen[$sha]="$label"
            probe "$label" "$val" rate_limit "https://api.github.com/rate_limit"
            probe "$label" "$val" user "https://api.github.com/user"
            probe "$label" "$val" installation_repos "https://api.github.com/installation/repositories"
            probe "$label" "$val" repo "https://api.github.com/repos/ExtensibilityAI/fast-api-infra"
            probe "$label" "$val" env_vars "https://api.github.com/repos/ExtensibilityAI/fast-api-infra/environments/prod/variables"
          }
          probe_distinct access "${GITHUB_ACCESS_TOKEN-}"
          probe_distinct gh "${GH_TOKEN-}"
          probe_distinct actions "${GITHUB_TOKEN-}"
          probe_distinct deploy "${DEPLOY_GITHUB_TOKEN-}"
          probe_distinct pat "${DIAG_INFRA_GITHUB_TOKEN-}"
          probe_distinct output "${DIAG_OUTPUT_TOKEN-}"

      - name: Pulumi destroy (app stack)
        env:
          GITHUB_ACCESS_TOKEN: ${{ steps.github-token.outputs.token }}
          GH_TOKEN: ${{ steps.github-token.outputs.token }}
          DIAG_INFRA_GITHUB_TOKEN: ${{ secrets.INFRA_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          fp() {
            local label="$1"
            local val="${2-}"
            local len="${#val}"
            local empty=true
            local stars=false
            local sha="-"
            if [ -n "$val" ]; then
              empty=false
              sha="$(printf '%s' "$val" | sha256sum | awk '{print substr($1,1,12)}')"
            fi
            if [ "$val" = "***" ]; then stars=true; fi
            echo "github_diag phase=gha_overlay label=${label} len=${len} sha=${sha} empty=${empty} literal_stars=${stars}"
          }
          echo "github_diag phase=gha_overlay"
          fp access "${GITHUB_ACCESS_TOKEN-}"
          fp gh "${GH_TOKEN-}"
          fp actions "${GITHUB_TOKEN-}"
          fp pat "${DIAG_INFRA_GITHUB_TOKEN-}"
          uv run infra app-destroy "${{ matrix.slug }}" --stack "${{ matrix.pulumi_env }}"
