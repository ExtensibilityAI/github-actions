name: Deploy GKE app

on:
  workflow_call:
    inputs:
      images:
        description: >
          JSON array of image specs. Each object needs name; optional fields:
          dockerfile, context, role (api|frontend|app), deployment, container,
          needs_pypi_auth, build_secret_env.
        type: string
        required: true

      uv_index_prefix:
        type: string
        required: false
        default: EXTENSIBILITY_AI

      deploy_method:
        description: kubectl or helm
        type: string
        required: false
        default: kubectl

      helm_chart:
        type: string
        required: false
        default: ''
      helm_image_repository_suffix:
        description: Defaults to first image name when empty
        type: string
        required: false
        default: ''
      helm_repo_name:
        type: string
        required: false
        default: ''
      helm_repo_url:
        type: string
        required: false
        default: ''

      run_migrations:
        type: boolean
        required: false
        default: false
      db_secret_name_prefix:
        type: string
        required: false
        default: ''
      db_user:
        type: string
        required: false
        default: ''
      db_name:
        type: string
        required: false
        default: ''
      instance_name_prefix:
        type: string
        required: false
        default: platform-db
      migration_extra_env:
        description: >
          Opaque newline-delimited KEY=VALUE (expanded in the caller). Never put
          product-specific names in this reusable workflow itself.
        type: string
        required: false
        default: ''

      publish_sdk:
        type: boolean
        required: false
        default: false
      sdk_directory:
        type: string
        required: false
        default: sdk
      force_publish_sdk:
        type: boolean
        required: false
        default: false

      dispatch_environment:
        type: string
        required: false
        default: ''

jobs:
  set-env:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env.outputs.env }}
      stack: ${{ steps.env.outputs.stack }}
      sdk_changed: ${{ steps.detect.outputs.changed || steps.detect-skip.outputs.changed || 'false' }}
      matrix: ${{ steps.images.outputs.matrix }}
      first_name: ${{ steps.images.outputs.first_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: ExtensibilityAI/github-actions/parse-image-matrix@v2.0.0
        id: images
        with:
          images: ${{ inputs.images }}

      - uses: ExtensibilityAI/github-actions/detect-path-changes@v2.0.0
        id: detect
        if: inputs.publish_sdk
        with:
          path_prefix: ${{ inputs.sdk_directory }}
          force: ${{ inputs.force_publish_sdk }}

      - name: Default sdk_changed when publish_sdk is false
        if: ${{ !inputs.publish_sdk }}
        id: detect-skip
        run: echo "changed=false" >> "$GITHUB_OUTPUT"

      - uses: ExtensibilityAI/github-actions/set-deploy-env@v2.0.0
        id: env
        with:
          mode: app
          dispatch_environment: ${{ inputs.dispatch_environment || github.event.inputs.environment || '' }}

  build:
    needs: set-env
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.env }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.set-env.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ExtensibilityAI/github-actions/docker-build-push@v2.0.0
        id: build
        with:
          image_name: ${{ matrix.name }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_region: ${{ vars.GCP_REGION || 'us-central1' }}
          wif_provider: ${{ vars.WIF_PROVIDER }}
          gcp_sa: ${{ vars.GCP_SA }}
          needs_pypi_auth: ${{ matrix.needs_pypi_auth }}
          pypi_sa: ${{ vars.PYPI_SA }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}
          build_secret_env: ${{ matrix.build_secret_env }}

      - name: Write image-changed artifact
        env:
          NAME: ${{ matrix.name }}
          CHANGED: ${{ steps.build.outputs.image_changed }}
        run: |
          set -euo pipefail
          mkdir -p image-changed
          # sanitize name for path
          SAFE=$(echo "$NAME" | tr '/' '_')
          echo "$CHANGED" > "image-changed/${SAFE}"
          echo "$NAME" > "image-changed/${SAFE}.name"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-changed-${{ matrix.name }}
          path: image-changed/
          retention-days: 1

  build-summary:
    needs: [set-env, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.summary.outputs.any_changed }}
      changed_by_name: ${{ steps.summary.outputs.changed_by_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-changed-*
          merge-multiple: true
          path: image-changed

      - id: summary
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, pathlib

          root = pathlib.Path("image-changed")
          mapping = {}
          for name_file in root.glob("*.name"):
              stem = name_file.name[: -len(".name")]
              img_name = name_file.read_text(encoding="utf-8").strip()
              flag_path = root / stem
              flag = flag_path.read_text(encoding="utf-8").strip() if flag_path.exists() else "false"
              mapping[img_name] = flag

          any_changed = "true" if any(v == "true" for v in mapping.values()) else "false"
          changed_json = json.dumps(mapping, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"any_changed={any_changed}\n")
              fh.write(f"changed_by_name={changed_json}\n")
          print(f"any_changed={any_changed} mapping={changed_json}")
          PY

  sdk-publish:
    needs: set-env
    if: inputs.publish_sdk && (needs.set-env.outputs.sdk_changed == 'true')
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ExtensibilityAI/github-actions/publish-python-sdk@v2.0.0
        with:
          deploy_env: ${{ needs.set-env.outputs.env }}
          working_directory: ${{ inputs.sdk_directory }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_region: ${{ vars.GCP_REGION || 'us-central1' }}
          wif_provider: ${{ vars.WIF_PROVIDER }}
          pypi_sa: ${{ vars.PYPI_SA }}

  migrations:
    needs: [set-env, build-summary]
    if: |
      always() &&
      inputs.run_migrations &&
      needs.build-summary.result == 'success' &&
      needs.build-summary.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.env }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ExtensibilityAI/github-actions/cloud-sql-migrate@v2.0.0
        with:
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_region: ${{ vars.GCP_REGION || 'us-central1' }}
          wif_provider: ${{ vars.WIF_PROVIDER }}
          gcp_sa: ${{ vars.GCP_SA }}
          pypi_sa: ${{ vars.PYPI_SA }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}
          deploy_env: ${{ needs.set-env.outputs.env }}
          db_secret_name_prefix: ${{ inputs.db_secret_name_prefix }}
          db_user: ${{ inputs.db_user }}
          db_name: ${{ inputs.db_name }}
          instance_name_prefix: ${{ inputs.instance_name_prefix }}
          extra_env: ${{ inputs.migration_extra_env }}

  deploy:
    needs: [set-env, migrations, build-summary]
    if: |
      always() &&
      needs.build-summary.result == 'success' &&
      needs.build-summary.outputs.any_changed == 'true' &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.set-env.outputs.env }}
    permissions:
      id-token: write
      contents: read
    env:
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c # v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_REGION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Kubectl rollout
        if: inputs.deploy_method == 'kubectl'
        uses: ExtensibilityAI/github-actions/kubectl-rollout@v2.0.0
        with:
          images_json: ${{ needs.set-env.outputs.matrix }}
          changed_by_name: ${{ needs.build-summary.outputs.changed_by_name }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_region: ${{ vars.GCP_REGION || 'us-central1' }}
          k8s_namespace: ${{ vars.K8S_NAMESPACE }}

      - name: Helm rollout
        if: inputs.deploy_method == 'helm'
        uses: ExtensibilityAI/github-actions/helm-rollout@v2.0.0
        with:
          helm_chart: ${{ inputs.helm_chart }}
          helm_image_repository_suffix: ${{ inputs.helm_image_repository_suffix || needs.set-env.outputs.first_name }}
          helm_repo_name: ${{ inputs.helm_repo_name }}
          helm_repo_url: ${{ inputs.helm_repo_url }}
          helm_release_var: ${{ vars.HELM_RELEASE }}
          gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          gcp_region: ${{ vars.GCP_REGION || 'us-central1' }}
          k8s_namespace: ${{ vars.K8S_NAMESPACE }}
