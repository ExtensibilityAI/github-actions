name: actionlint

on:
  push:
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '.github/workflows/**'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          EXPECTED_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o actionlint.tar.gz "$URL"
          ACTUAL="$(sha256sum actionlint.tar.gz | awk '{print $1}')"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::actionlint checksum mismatch (got $ACTUAL, expected $EXPECTED_SHA256)"
            exit 1
          fi
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/

      - name: Run actionlint
        run: |
          set -euo pipefail
          mapfile -t workflow_files < <(find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \))
          actionlint "${workflow_files[@]}"

      - name: Validate composite action metadata
        run: |
          set -euo pipefail
          while IFS= read -r -d '' action_file; do
            if ! grep -q '^runs:' "$action_file"; then
              echo "::error::$action_file is missing a runs: section"
              exit 1
            fi
            if ! grep -q 'using: composite' "$action_file"; then
              echo "::error::$action_file must declare using: composite"
              exit 1
            fi
          done < <(find . -path './.git' -prune -o -name 'action.yml' -print0)
