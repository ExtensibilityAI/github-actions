name: CI compose config

on:
  workflow_call:
    inputs:
      compose_files:
        description: Optional compose file args (e.g. -f docker-compose.yml)
        type: string
        required: false
        default: ''

jobs:
  compose_config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Bash syntax check scripts
        run: |
          set -euo pipefail
          if [ -d scripts ]; then
            find scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n
          fi
          for f in entrypoint.sh init.sh; do
            if [ -f "$f" ]; then
              bash -n "$f"
            fi
          done
          echo "bash -n OK"
      - name: docker compose config
        run: |
          set -euo pipefail
          EXTRA="${{ inputs.compose_files }}"
          # shellcheck disable=SC2086
          docker compose $EXTRA config >/dev/null
          echo "compose config OK"
