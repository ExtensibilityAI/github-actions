name: CI Python package

on:
  workflow_call:
    inputs:
      working_directory:
        description: Package root relative to repo
        type: string
        required: false
        default: .
      python_version:
        type: string
        required: false
        default: '3.11'
      needs_pypi_auth:
        type: boolean
        required: false
        default: false
      uv_index_prefix:
        description: >
          Prefix for UV_INDEX_<prefix>_PYPI_* credentials. Must match the
          [[tool.uv.index]] name with hyphens turned into underscores and
          without a trailing _PYPI (e.g. EXT_STORE_INFRA_3320 for index
          ext-store-infra-3320-pypi). No default — callers must pass the
          deployment-specific prefix.
        type: string
        required: true
      github_environment:
        description: >
          GitHub Environment used only to resolve vars/secrets for CI (e.g. WIF for
          private PyPI). This is not a deploy target — prefer staging so CI never
          needs prod credentials. Deploy/publish workflows select staging vs prod
          separately via set-deploy-env.
        type: string
        required: false
        default: staging
      cloud:
        description: gcp (Artifact Registry WIF) or aws (CodeArtifact OIDC). Default gcp.
        type: string
        required: false
        default: gcp

jobs:
  test:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github_environment }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Set up Python
        run: uv python install ${{ inputs.python_version }}

      - name: Authenticate to PyPI (GCP)
        if: ${{ inputs.needs_pypi_auth && inputs.cloud != 'aws' }}
        uses: ExtensibilityAI/github-actions/setup-pypi-auth@v2.6.8
        with:
          wif_provider: ${{ vars.WIF_PROVIDER }}
          pypi_sa: ${{ vars.PYPI_SA }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}

      - name: Authenticate to CodeArtifact (AWS)
        if: ${{ inputs.needs_pypi_auth && inputs.cloud == 'aws' }}
        uses: ExtensibilityAI/github-actions/setup-codeartifact-auth@v2.6.8
        with:
          aws_role_arn: ${{ vars.PYPI_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws_region: ${{ vars.AWS_REGION }}
          uv_index_prefix: ${{ inputs.uv_index_prefix }}
          codeartifact_domain: ${{ vars.CODEARTIFACT_DOMAIN }}
          codeartifact_repo: ${{ vars.CODEARTIFACT_REPOSITORY || 'pypi' }}
          codeartifact_domain_owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
          required: 'true'

      - name: Install
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test
        run: uv run pytest
