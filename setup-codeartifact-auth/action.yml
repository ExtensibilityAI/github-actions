name: Setup CodeArtifact auth
description: Authenticate to AWS via OIDC and export uv index credentials for CodeArtifact PyPI.

inputs:
  aws_role_arn:
    description: IAM role ARN for GitHub Actions
    required: true
  aws_region:
    description: AWS region
    required: true
  uv_index_prefix:
    description: Prefix for UV_INDEX_* env vars (e.g. EXTENSIBILITY_AI)
    required: true
  codeartifact_domain:
    description: CodeArtifact domain (falls back to CODEARTIFACT_DOMAIN env)
    required: false
    default: ''
  codeartifact_repo:
    description: CodeArtifact repository name
    required: false
    default: pypi
  codeartifact_domain_owner:
    description: >
      Account that owns the CodeArtifact domain (canonical/prod member).
      Falls back to CODEARTIFACT_DOMAIN_OWNER, then the caller account.
    required: false
    default: ''
  required:
    description: >
      If true, fail when the domain is unset (app stacks). If false, skip
      token export with a warning (public-PyPI platform jobs).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Validate uv index prefix
      shell: bash
      env:
        UV_INDEX_PREFIX: ${{ inputs.uv_index_prefix }}
      run: |
        set -euo pipefail
        if ! [[ "$UV_INDEX_PREFIX" =~ ^[A-Z][A-Z0-9_]{0,62}$ ]]; then
          echo "::error::uv_index_prefix must match ^[A-Z][A-Z0-9_]{0,62}$"
          exit 1
        fi

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Export uv index credentials
      shell: bash
      env:
        AWS_REGION: ${{ inputs.aws_region }}
        UV_INDEX_PREFIX: ${{ inputs.uv_index_prefix }}
        INPUT_DOMAIN: ${{ inputs.codeartifact_domain }}
        INPUT_REPO: ${{ inputs.codeartifact_repo }}
        INPUT_OWNER: ${{ inputs.codeartifact_domain_owner }}
        REQUIRE_DOMAIN: ${{ inputs.required }}
      run: |
        set -euo pipefail
        DOMAIN="${INPUT_DOMAIN:-${CODEARTIFACT_DOMAIN:-}}"
        REPO="${INPUT_REPO:-pypi}"
        OWNER="${INPUT_OWNER:-${CODEARTIFACT_DOMAIN_OWNER:-}}"
        if [ -z "$OWNER" ]; then
          OWNER="${AWS_ACCOUNT_ID:-$(aws sts get-caller-identity --query Account --output text)}"
        fi
        if [ -z "$DOMAIN" ]; then
          if [ "${REQUIRE_DOMAIN}" = "true" ]; then
            echo "::error::CODEARTIFACT_DOMAIN is required for this job (app stack CodeArtifact index)"
            exit 1
          fi
          echo "::warning::CODEARTIFACT_DOMAIN not set; skipping CodeArtifact token export"
          exit 0
        fi
        TOKEN="$(aws codeartifact get-authorization-token --domain "$DOMAIN" --domain-owner "$OWNER" --query authorizationToken --output text)"
        echo "UV_INDEX_${UV_INDEX_PREFIX}_PYPI_USERNAME=aws" >> "$GITHUB_ENV"
        echo "::add-mask::$TOKEN"
        echo "UV_INDEX_${UV_INDEX_PREFIX}_PYPI_PASSWORD=$TOKEN" >> "$GITHUB_ENV"
