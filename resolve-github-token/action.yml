name: Resolve GitHub token
description: |
  Mint an installation access token via actions/create-github-app-token and export
  it as GITHUB_TOKEN and GITHUB_ACCESS_TOKEN for pulumi-github.
  create-github-app-token already masks the token in logs; do not ::add-mask::
  again before GITHUB_ENV (that can redact GITHUB_TOKEN to *** and 401 later).
inputs:
  infra-github-token:
    description: Unused in GitHub App mode (accepted for workflow compatibility)
    required: false
    default: ''
  app-id:
    description: Value of secrets.INFRA_GITHUB_APP_ID
    required: true
  private-key:
    description: Value of secrets.INFRA_GITHUB_APP_PRIVATE_KEY
    required: true
runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
    - name: Export App token for pulumi-github
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        if [ -z "$APP_TOKEN" ]; then
          echo "::error::create-github-app-token returned an empty token"
          exit 1
        fi
        {
          echo "GITHUB_TOKEN<<EOF"
          echo "$APP_TOKEN"
          echo "EOF"
          echo "GITHUB_ACCESS_TOKEN<<EOF"
          echo "$APP_TOKEN"
          echo "EOF"
        } >> "$GITHUB_ENV"
    - name: Verify GITHUB_TOKEN was exported
      shell: bash
      run: |
        set -euo pipefail
        if [ "${#GITHUB_TOKEN}" -lt 20 ]; then
          echo "::error::GITHUB_TOKEN missing or redacted after export (len=${#GITHUB_TOKEN})"
          exit 1
        fi
