name: Resolve GitHub token
description: |
  Mint an installation access token via actions/create-github-app-token and export
  it as GITHUB_ACCESS_TOKEN and GH_TOKEN for pulumi-github.
  Do not write reserved GITHUB_TOKEN to GITHUB_ENV — GitHub ignores that overwrite
  in reusable workflows, so later steps keep the default Actions token (scoped to
  the caller repo) and 401 on other-repo environment APIs.
inputs:
  infra-github-token:
    description: Unused in GitHub App mode (accepted for workflow compatibility)
    required: false
    default: ''
  app-id:
    description: Value of secrets.INFRA_GITHUB_APP_ID
    required: true
  private-key:
    description: Value of secrets.INFRA_GITHUB_APP_PRIVATE_KEY
    required: true
outputs:
  token:
    description: GitHub App installation token
    value: ${{ steps.app-token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
    - name: Export App token for pulumi-github
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        set -euo pipefail
        if [ -z "$APP_TOKEN" ]; then
          echo "::error::create-github-app-token returned an empty token"
          exit 1
        fi
        {
          echo "GITHUB_ACCESS_TOKEN<<EOF"
          echo "$APP_TOKEN"
          echo "EOF"
          echo "GH_TOKEN<<EOF"
          echo "$APP_TOKEN"
          echo "EOF"
        } >> "$GITHUB_ENV"
    - name: Verify GITHUB_ACCESS_TOKEN was exported
      shell: bash
      run: |
        set -euo pipefail
        if [ "${#GITHUB_ACCESS_TOKEN}" -lt 20 ]; then
          echo "::error::GITHUB_ACCESS_TOKEN missing or redacted after export (len=${#GITHUB_ACCESS_TOKEN})"
          exit 1
        fi
