name: Cloud SQL migrate
description: >
  Fetch DB password from Secret Manager, start Cloud SQL Auth Proxy, run
  alembic upgrade head. Optional opaque extra_env (KEY=VALUE lines) is exported
  to GITHUB_ENV before migrate — callers expand product-specific values there.

inputs:
  gcp_project_id:
    required: true
  gcp_region:
    required: true
  wif_provider:
    required: true
  gcp_sa:
    required: true
  pypi_sa:
    required: true
  uv_index_prefix:
    required: true
  deploy_env:
    description: staging or prod (used in secret/instance names and CONFIG_ENV)
    required: true
  db_secret_name_prefix:
    description: Secret name prefix; -${deploy_env} is appended
    required: true
  db_user:
    required: true
  db_name:
    required: true
  instance_name_prefix:
    description: Cloud SQL instance prefix; -${deploy_env} is appended
    required: false
    default: platform-db
  working_directory:
    required: false
    default: backend
  extra_env:
    description: Newline-delimited KEY=VALUE (values expanded by caller)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Authenticate to PyPI
      uses: ExtensibilityAI/github-actions/setup-pypi-auth@v2.0.0
      with:
        wif_provider: ${{ inputs.wif_provider }}
        pypi_sa: ${{ inputs.pypi_sa }}
        uv_index_prefix: ${{ inputs.uv_index_prefix }}

    - name: Authenticate to GCP (WIF)
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        workload_identity_provider: ${{ inputs.wif_provider }}
        service_account: ${{ inputs.gcp_sa }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

    - name: Get DB password from Secret Manager
      id: db-secret
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.gcp_project_id }}
        ENV: ${{ inputs.deploy_env }}
        SECRET_PREFIX: ${{ inputs.db_secret_name_prefix }}
      run: |
        set -euo pipefail
        SECRET="${SECRET_PREFIX}-${ENV}"
        PASSWORD=$(gcloud secrets versions access latest --secret="$SECRET" --project="${PROJECT_ID}")
        echo "::add-mask::$PASSWORD"
        echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

    - uses: ExtensibilityAI/github-actions/install-cloud-sql-proxy@v2.0.0

    - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

    - name: Set up Python
      shell: bash
      run: uv python install 3.11

    - name: Apply extra migration env
      shell: bash
      env:
        EXTRA_ENV: ${{ inputs.extra_env }}
      run: |
        set -euo pipefail
        if [ -z "${EXTRA_ENV:-}" ]; then
          exit 0
        fi
        while IFS= read -r line || [ -n "$line" ]; do
          # skip blank lines and comments
          [ -z "$line" ] && continue
          case "$line" in
            \#*) continue ;;
          esac
          if [[ "$line" != *=* ]]; then
            echo "::warning::Ignoring migration_extra_env line without '=': $line"
            continue
          fi
          echo "$line" >> "$GITHUB_ENV"
        done <<< "$EXTRA_ENV"

    - name: Run migrations
      shell: bash
      env:
        CONFIG_ENV: ${{ inputs.deploy_env }}
        DATABASE_HOST: 127.0.0.1
        DATABASE_USER: ${{ inputs.db_user }}
        DATABASE_PASSWORD: ${{ steps.db-secret.outputs.password }}
        DATABASE_NAME: ${{ inputs.db_name }}
        DATABASE_PORT: 5432
        PROJECT_ID: ${{ inputs.gcp_project_id }}
        REGION: ${{ inputs.gcp_region }}
        INSTANCE_PREFIX: ${{ inputs.instance_name_prefix }}
        ENV: ${{ inputs.deploy_env }}
        WORKDIR: ${{ inputs.working_directory }}
      run: |
        set -euo pipefail
        INSTANCE_NAME="${INSTANCE_PREFIX}-${ENV}"
        CONNECTION_NAME="${PROJECT_ID}:${REGION}:${INSTANCE_NAME}"
        cloud-sql-proxy --port=5432 "$CONNECTION_NAME" &
        sleep 3
        cd "$WORKDIR" && uv sync && uv run alembic upgrade head
        kill %1 2>/dev/null || true
