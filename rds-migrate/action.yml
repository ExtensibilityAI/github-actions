name: RDS migrate
description: >
  Thin wrapper around k8s-migrate with cloud=aws. Run alembic upgrade head as a
  short-lived EKS Job (VPC-private RDS). Uses ConfigMap app-env for DATABASE_*
  and Secret db for the password. Prefer DATABASE_DIRECT_HOST / DATABASE_DIRECT_PORT
  when set (pooler-safe), else DATABASE_HOST / DATABASE_PORT. Prefer calling
  k8s-migrate directly for new workloads.

inputs:
  aws_role_arn:
    description: IAM role ARN for GitHub Actions OIDC
    required: true
  aws_region:
    description: AWS region
    required: true
  deploy_env:
    description: staging or prod (set as CONFIG_ENV on the Job)
    required: true
  eks_cluster_name:
    required: true
  eks_region:
    description: Defaults to aws_region when empty
    required: false
    default: ''
  k8s_namespace:
    required: true
  migration_image:
    description: Full ECR image reference (registry/repo:tag)
    required: true
  migration_command:
    description: Shell command run in the Job container (TAG images alembic on PATH, not uv run)
    required: false
    default: alembic upgrade head
  service_account:
    description: Kubernetes ServiceAccount name (WI-bound app SA)
    required: false
    default: api
  config_map_name:
    description: ConfigMap with DATABASE_HOST / USER / NAME / etc.
    required: false
    default: app-env
  db_secret_name:
    description: K8s Secret with password key
    required: false
    default: db
  db_secret_key:
    required: false
    default: password
  extra_env:
    description: >
      Newline-delimited KEY=VALUE (literal env on the Job). Multiline values
      (e.g. PEMs) continue until the next KEY= line.
    required: false
    default: ''
  job_timeout_seconds:
    required: false
    default: '600'

runs:
  using: composite
  steps:
    - name: Run k8s-migrate (aws)
      uses: $/k8s-migrate
      with:
        cloud: aws
        aws_role_arn: ${{ inputs.aws_role_arn }}
        aws_region: ${{ inputs.aws_region }}
        eks_cluster_name: ${{ inputs.eks_cluster_name }}
        eks_region: ${{ inputs.eks_region }}
        deploy_env: ${{ inputs.deploy_env }}
        k8s_namespace: ${{ inputs.k8s_namespace }}
        migration_image: ${{ inputs.migration_image }}
        migration_command: ${{ inputs.migration_command }}
        service_account: ${{ inputs.service_account }}
        config_map_name: ${{ inputs.config_map_name }}
        db_secret_name: ${{ inputs.db_secret_name }}
        db_secret_key: ${{ inputs.db_secret_key }}
        extra_env: ${{ inputs.extra_env }}
        job_timeout_seconds: ${{ inputs.job_timeout_seconds }}
