name: K8s migrate
description: >
  Run alembic (or migration_command) as a short-lived Kubernetes Job inside
  the cluster (GKE or EKS). Uses ConfigMap app-env for DATABASE_* and Secret
  db for the password. Prefer DATABASE_DIRECT_HOST / DATABASE_DIRECT_PORT when
  set (pooler-safe — migrations must bypass PgBouncer), else DATABASE_HOST /
  DATABASE_PORT. Requires the app Pulumi stack to have created namespace,
  app-env, and db Secret first.

inputs:
  cloud:
    description: gcp or aws (selects cluster credentials)
    required: true

  # --- AWS (cloud=aws) ---
  aws_role_arn:
    description: IAM role ARN for GitHub Actions OIDC (required when cloud=aws)
    required: false
    default: ''
  aws_region:
    description: AWS region (required when cloud=aws)
    required: false
    default: ''
  eks_cluster_name:
    description: EKS cluster name (required when cloud=aws)
    required: false
    default: ''
  eks_region:
    description: Defaults to aws_region when empty
    required: false
    default: ''

  # --- GCP (cloud=gcp) ---
  wif_provider:
    description: Workload Identity Federation provider (required when cloud=gcp)
    required: false
    default: ''
  gcp_sa:
    description: GCP service account email for WIF (required when cloud=gcp)
    required: false
    default: ''
  gcp_project_id:
    description: GCP project ID (required when cloud=gcp)
    required: false
    default: ''
  gke_cluster_name:
    description: GKE cluster name (required when cloud=gcp)
    required: false
    default: ''
  gke_location:
    description: GKE region or zone (required when cloud=gcp)
    required: false
    default: ''

  # --- Shared ---
  deploy_env:
    description: staging or prod (set as CONFIG_ENV on the Job)
    required: true
  k8s_namespace:
    required: true
  migration_image:
    description: Full image reference (registry/repo:tag)
    required: true
  migration_command:
    description: Shell command run in the Job container (TAG images alembic on PATH, not uv run)
    required: false
    default: alembic upgrade head
  service_account:
    description: Kubernetes ServiceAccount name (WI/IRSA-bound app SA)
    required: false
    default: api
  config_map_name:
    description: ConfigMap with DATABASE_HOST / USER / NAME / etc.
    required: false
    default: app-env
  db_secret_name:
    description: K8s Secret with password key
    required: false
    default: db
  db_secret_key:
    required: false
    default: password
  extra_env:
    description: >
      Newline-delimited KEY=VALUE (literal env on the Job). Multiline values
      (e.g. PEMs) continue until the next KEY= line.
    required: false
    default: ''
  job_timeout_seconds:
    required: false
    default: '600'

runs:
  using: composite
  steps:
    - name: Validate cloud
      shell: bash
      env:
        CLOUD: ${{ inputs.cloud }}
      run: |
        set -euo pipefail
        case "$CLOUD" in
          gcp|aws) ;;
          *)
            echo "::error::cloud must be gcp or aws (got '${CLOUD}')"
            exit 1
            ;;
        esac

    - name: Configure AWS credentials
      if: inputs.cloud == 'aws'
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
      with:
        role-to-assume: ${{ inputs.aws_role_arn }}
        aws-region: ${{ inputs.aws_region }}

    - name: Update kubeconfig for EKS
      if: inputs.cloud == 'aws'
      shell: bash
      env:
        CLUSTER: ${{ inputs.eks_cluster_name }}
        REGION: ${{ inputs.eks_region }}
        AWS_REGION: ${{ inputs.aws_region }}
      run: |
        set -euo pipefail
        if [ -z "${CLUSTER:-}" ] || [ -z "${AWS_REGION:-}" ]; then
          echo "::error::eks_cluster_name and aws_region are required when cloud=aws"
          exit 1
        fi
        aws eks update-kubeconfig \
          --name "$CLUSTER" \
          --region "${REGION:-$AWS_REGION}"

    - name: Authenticate to GCP (WIF)
      if: inputs.cloud == 'gcp'
      uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
      with:
        workload_identity_provider: ${{ inputs.wif_provider }}
        service_account: ${{ inputs.gcp_sa }}

    - name: Set up Cloud SDK
      if: inputs.cloud == 'gcp'
      uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

    - name: Get GKE credentials
      if: inputs.cloud == 'gcp'
      uses: google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c # v2
      with:
        cluster_name: ${{ inputs.gke_cluster_name }}
        location: ${{ inputs.gke_location }}
        project_id: ${{ inputs.gcp_project_id }}

    - name: Apply extra migration env
      id: extra
      shell: bash
      env:
        EXTRA_ENV: ${{ inputs.extra_env }}
      run: |
        set -euo pipefail
        OUT="${RUNNER_TEMP}/migrate-extra-env.json"
        if [ -z "${EXTRA_ENV:-}" ]; then
          echo '[]' > "$OUT"
          echo "extra_env_file=$OUT" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        python3 "${{ github.action_path }}/../scripts/migration_extra_env.py" write-json "$OUT"
        echo "extra_env_file=$OUT" >> "$GITHUB_OUTPUT"

    - name: Run migration Job
      shell: bash
      env:
        NS: ${{ inputs.k8s_namespace }}
        IMAGE: ${{ inputs.migration_image }}
        CMD: ${{ inputs.migration_command }}
        SA: ${{ inputs.service_account }}
        CM: ${{ inputs.config_map_name }}
        SECRET: ${{ inputs.db_secret_name }}
        SECRET_KEY: ${{ inputs.db_secret_key }}
        TIMEOUT: ${{ inputs.job_timeout_seconds }}
        SHA: ${{ github.sha }}
        DEPLOY_ENV: ${{ inputs.deploy_env }}
        EXTRA_ENV_FILE: ${{ steps.extra.outputs.extra_env_file }}
      run: |
        set -euo pipefail
        SHORT="${SHA:0:8}"
        JOB="migrate-${SHORT}"
        JOB=$(echo "$JOB" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | cut -c1-63)
        export JOB_NAME="$JOB"

        kubectl -n "$NS" delete job "$JOB" --ignore-not-found=true >/dev/null 2>&1 || true

        python3 <<'PY'
        import json
        import os
        import pathlib
        import subprocess

        ns = os.environ["NS"]
        image = os.environ["IMAGE"]
        cmd = os.environ["CMD"]
        sa = os.environ["SA"]
        cm = os.environ["CM"]
        secret = os.environ["SECRET"]
        secret_key = os.environ["SECRET_KEY"]
        job = os.environ["JOB_NAME"]
        deploy_env = os.environ["DEPLOY_ENV"]
        extra_file = os.environ.get("EXTRA_ENV_FILE", "")

        env_list = [
            {"name": "CONFIG_ENV", "value": deploy_env},
            {
                "name": "DATABASE_PASSWORD",
                "valueFrom": {
                    "secretKeyRef": {"name": secret, "key": secret_key},
                },
            },
        ]
        # Behind a PgBouncer pooler, app-env's DATABASE_HOST/PORT point at the pooler;
        # migrations connect to the database directly (DATABASE_DIRECT_*).
        cm_data = json.loads(
            subprocess.run(
                ["kubectl", "-n", ns, "get", "configmap", cm, "-o", "json"],
                check=True,
                capture_output=True,
                text=True,
            ).stdout
        ).get("data") or {}
        if cm_data.get("DATABASE_DIRECT_HOST"):
            print("app-env has DATABASE_DIRECT_HOST: migrating against the database directly")
            for name, key in (
                ("DATABASE_HOST", "DATABASE_DIRECT_HOST"),
                ("DATABASE_PORT", "DATABASE_DIRECT_PORT"),
            ):
                if cm_data.get(key):
                    env_list.append(
                        {
                            "name": name,
                            "valueFrom": {"configMapKeyRef": {"name": cm, "key": key}},
                        }
                    )
        if extra_file and pathlib.Path(extra_file).is_file():
            extra = json.loads(pathlib.Path(extra_file).read_text(encoding="utf-8"))
            for item in extra:
                env_list.append(
                    {"name": item["name"], "value": item["value"]},
                )

        manifest = {
            "apiVersion": "batch/v1",
            "kind": "Job",
            "metadata": {
                "name": job,
                "namespace": ns,
                "labels": {"app.kubernetes.io/component": "migrate"},
            },
            "spec": {
                "backoffLimit": 0,
                "ttlSecondsAfterFinished": 600,
                "template": {
                    "metadata": {
                        "labels": {"app.kubernetes.io/component": "migrate"},
                    },
                    "spec": {
                        "serviceAccountName": sa,
                        "restartPolicy": "Never",
                        "containers": [
                            {
                                "name": "migrate",
                                "image": image,
                                "imagePullPolicy": "Always",
                                "command": ["/bin/sh", "-c", cmd],
                                "envFrom": [{"configMapRef": {"name": cm}}],
                                "env": env_list,
                            }
                        ],
                    },
                },
            },
        }

        path = pathlib.Path(os.environ["RUNNER_TEMP"]) / f"{job}.json"
        path.write_text(json.dumps(manifest), encoding="utf-8")
        print(f"Applying Job {job} in {ns}")
        subprocess.run(["kubectl", "apply", "-f", str(path)], check=True)
        PY

        TIMEOUT="${TIMEOUT:-600}"
        if ! kubectl -n "$NS" wait --for=condition=complete "job/${JOB}" --timeout="${TIMEOUT}s"; then
          echo "::error::Migration Job ${JOB} failed or timed out"
          kubectl -n "$NS" describe "job/${JOB}" || true
          kubectl -n "$NS" logs "job/${JOB}" --all-containers=true || true
          kubectl -n "$NS" delete job "$JOB" --ignore-not-found=true || true
          exit 1
        fi
        echo "Migration Job ${JOB} completed"
        kubectl -n "$NS" logs "job/${JOB}" --all-containers=true || true
        kubectl -n "$NS" delete job "$JOB" --ignore-not-found=true || true
