name: Set deploy environment
description: |
  Resolve deploy environment and stack from event context (CI is separate and
  typically pins github_environment=staging for WIF only).
  Both app and package: workflow_dispatch→input, pull_request→staging,
  push/tag→prod.

inputs:
  mode:
    description: app or package (retained for caller clarity; selection rules are shared)
    required: true
  dispatch_environment:
    description: Environment from workflow_dispatch (staging or prod)
    required: false
    default: ''

outputs:
  env:
    description: Target environment (staging or prod)
    value: ${{ steps.resolve.outputs.env }}
  stack:
    description: Pulumi/stack name (same as env for app/package)
    value: ${{ steps.resolve.outputs.stack }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        DISPATCH_ENV: ${{ inputs.dispatch_environment }}
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        set -euo pipefail
        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          ENV="${DISPATCH_ENV:-staging}"
        elif [ "$EVENT_NAME" = "pull_request" ]; then
          ENV=staging
        else
          # push to main, tags, etc. → prod
          ENV=prod
        fi
        echo "env=$ENV" >> "$GITHUB_OUTPUT"
        echo "stack=$ENV" >> "$GITHUB_OUTPUT"
